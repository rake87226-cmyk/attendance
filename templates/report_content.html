<section id="reports">
  <h1>Attendance report</h1>
  <div class="row">
    <label>From <input id="from" type="date"></label>
    <label>To <input id="to" type="date"></label>
    <button id="btnFilter" class="btn">Filter</button>
    <a id="btnCsv" class="btn" href="/api/export.csv">Export CSV</a>
  </div>
  <table id="reportTable"><thead><tr><th>Name</th><th>Roll</th><th>Morning</th><th>Afternoon</th><th>Evening</th></tr></thead><tbody></tbody></table>
</section>
